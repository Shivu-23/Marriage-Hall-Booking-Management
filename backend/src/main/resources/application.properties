spring.application.name=Marriage Hall Booking Management System
server.port=8080

# Update username/password if your local MySQL configuration is different.
spring.datasource.url=jdbc:mysql://localhost:3306/marriage_hall_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.error.include-message=always
